[package]
name = "uapz"
version = "0.1.0"
edition = "2024"
autobins = false

[workspace]
members = ["src-tauri"]
default-members = [".", "src-tauri"]
resolver = "3"

[dependencies]
base64 = "0.22"
globset = "0.4"
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
url = "2"
