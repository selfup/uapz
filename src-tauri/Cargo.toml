[package]
name = "uapz-desktop"
version = "0.1.0"
edition = "2024"
default-run = "uapz"

[[bin]]
name = "uapz"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
uapz = { path = ".." }

[features]
custom-protocol = ["tauri/custom-protocol"]
